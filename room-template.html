<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 방 템플릿 (Three.js)</title>
<style>
  /* ---- 화면 꾸미기(CSS). 3D와 직접 관련은 없으니 그냥 두셔도 됩니다. ---- */
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  #안내 {
    position: fixed; left: 0; right: 0; top: 0; z-index: 10;
    background: rgba(20,24,32,.82); color: #fff; padding: 10px 14px;
    font-size: 14px; line-height: 1.5;
  }
  #안내 b { color: #7fd1ff; }
  #조작 { position: fixed; right: 14px; bottom: 14px; z-index: 10; }
  button {
    font: inherit; font-size: 15px; padding: 10px 16px; border: 0; border-radius: 10px;
    background: #2f6fed; color: #fff; cursor: pointer;
  }
  button:hover { background: #1f57c8; }
  #물체이름 {
    position: fixed; left: 14px; bottom: 14px; z-index: 10;
    background: rgba(20,24,32,.82); color: #fff; padding: 8px 12px;
    border-radius: 8px; font-size: 14px;
  }
</style>
</head>
<body>

<!-- 화면 위쪽 한국어 설명 (규약: 모든 예제는 설명 1~2줄) -->
<div id="안내">
  <b>내 방 템플릿</b> — 마우스로 끌면 회전, 휠로 확대/축소, 오른쪽 버튼으로 이동합니다.<br>
  아래 코드의 <b>OBJECTS 목록</b>만 고치면 내 방 가구가 바뀝니다. (👉 "여기를 바꿔보세요" 부분을 찾아보세요)
</div>

<div id="물체이름">물체 위에 마우스를 올려보세요</div>
<div id="조작"><button id="문버튼">문 열기 / 닫기</button></div>

<!--
  importmap: 인터넷(CDN)에 있는 Three.js 라이브러리를 "three" 라는 짧은 이름으로 부를 수 있게 해줍니다.
  설치할 것이 없습니다. 인터넷만 연결되어 있으면 됩니다.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   ①  여기를 바꿔보세요 —  내 방의 가구 목록
   ---------------------------------------------------------------------
   name  : 물체 이름 (한국어 그대로 써도 됩니다)
   size  : 크기 [가로(x), 높이(y), 세로(z)] — 단위는 미터(m)
   pos   : 위치 [x, y, z] — y 는 "바닥에서 물체 중심까지" 이므로 보통 높이의 절반
   color : 색 (0x 뒤에 빨강초록파랑 16진수. 예: 0xff0000 = 빨강)

   ▸ 줄을 복사해서 붙여넣으면 가구가 늘어납니다.
   ▸ 지우면 사라집니다. 마음대로 해보세요. 망가져도 새로고침하면 됩니다.
   ===================================================================== */
const OBJECTS = [
  { name: '2층 침대-1층', size: [2.10, 0.35, 1.20], pos: [-1.00, 0.175, -1.10], color: 0x4a90e2 },
  { name: '2층 침대-2층', size: [2.10, 0.25, 1.20], pos: [-1.00, 1.425, -1.10], color: 0x4a90e2 },
  { name: '코너책상-가로', size: [1.00, 0.75, 0.50], pos: [-1.55, 0.375, 1.45], color: 0x9b59b6 },
  { name: '코너책상-세로', size: [0.50, 0.75, 1.00], pos: [-1.80, 0.375, 1.20], color: 0x9b59b6 },
  { name: '코너책상-왼쪽책장', size: [0.34, 0.67, 0.34], pos: [-1.22, 1.085, 1.53], color: 0x7D5A9E },
  { name: '코너책상-오른쪽책장', size: [0.34, 0.67, 0.33], pos: [-1.88, 1.085, 0.865], color: 0x7D5A9E },
  { name: '코너책상-윗판A', size: [0.66, 0.04, 0.34], pos: [-1.72, 1.40, 1.53], color: 0xB08BC3 },
  { name: '코너책상-윗판B', size: [0.34, 0.04, 0.66], pos: [-1.88, 1.40, 1.365], color: 0xB08BC3 },
  { name: '코너책상-왼쪽뒷판', size: [1.0, 0.67, 0.04], pos: [-1.55, 1.085, 1.68], color: 0xB08BC3 },
  { name: '코너책상-오른쪽뒷판', size: [0.04, 0.67, 1.0], pos: [-2.03, 1.085, 1.2], color: 0xB08BC3 },
  { name: '책상', size: [1.05, 0.75, 0.50], pos: [-0.525, 0.375, 1.45], color: 0x8e44ad },
  { name: '의자1-좌판', size: [0.45, 0.05, 0.45], pos: [-1.2, 0.425, 0.95], color: 0x403dff },
  { name: '의자1-등판', size: [0.45, 0.70, 0.10], pos: [-1.2, 0.80, 0.775], color: 0x403dff },
  { name: '의자2-좌판', size: [0.45, 0.05, 0.45], pos: [-0.6, 0.425, 0.95], color: 0x403dff },
  { name: '의자2-등판', size: [0.45, 0.70, 0.10], pos: [-0.6, 0.80, 0.775], color: 0x403dff },
  { name: '책꽂이',   size: [0.60, 1.40, 0.25], pos: [0.30, 0.70, 1.575], color: 0xf1c40f },
  { name: '옷장', size: [0.50, 1.75, 2.40], pos: [1.80, 0.875, -0.50], color: 0xff9500 },
  { name: '장식장', size: [0.40, 1.65, 0.75], pos: [1.85, 0.825, 1.075], color: 0x525354 },
  { name: '캣타워', size: [0.40, 2.40, 0.35], pos: [-1.80, 1.20, -0.20], color: 0xedd87b },
  { name: '수납의자',  size: [0.40, 0.40, 1.20],  pos: [0.25, 0.20, -1.10],  color: 0x54ffb5 },
  { name: '고양이 박스-1층', size: [0.55, 0.40, 0.40], pos: [1.05, 0.20, -1.5], color: 0xa87556 },
  { name: '고양이 박스-2층', size: [0.40, 0.15, 0.40], pos: [1.05, 0.475, -1.5], color: 0xab7b5e },
];

/* ---- 방 크기도 바꿔볼 수 있습니다 (단위: 미터) ---- */
const ROOM = { width: 4.1, depth: 3.4, height: 2.4 };

/* =====================================================================
   ②  아래부터는 "보일러플레이트"입니다.
       처음에는 몰라도 됩니다. 그대로 두고 ① 만 고쳐도 잘 동작합니다.
   ===================================================================== */

// --- 장면(Scene): 3D 물체들이 담기는 상자 ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ef);

// --- 카메라(Camera): 어디서 무엇을 보는가 ---
// (시야각 60도, 화면 비율, 가까운 한계 0.1m, 먼 한계 100m)
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5, 4, 6);   // 카메라 위치를 바꾸면 보는 각도가 달라집니다

// --- 렌더러(Renderer): 장면을 그림으로 그려서 화면에 붙여주는 담당 ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// --- 마우스로 화면을 돌려보는 기능 ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;   // 부드럽게 멈추기
controls.update();

// --- 조명(Light) ---
// 1) 전체를 은은하게 밝히는 빛
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
// 2) 해처럼 한 방향에서 오는 빛 (그림자를 만듭니다)
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(4, 7, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// --- 바닥 ---
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(ROOM.width, ROOM.depth),
  new THREE.MeshStandardMaterial({ color: 0xe8e0d5 })
);
floor.rotation.x = -Math.PI / 2;   // 평면을 눕힙니다 (-90도)
floor.receiveShadow = true;
floor.userData.name = '바닥';
scene.add(floor);

// --- 벽 2개 (뒷벽, 왼쪽 벽) ---
function 벽만들기(w, h, pos, rotY) {
  const 벽 = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({ color: 0xf5f2ec, side: THREE.DoubleSide })
  );
  벽.position.set(...pos);
  벽.rotation.y = rotY;
  벽.receiveShadow = true;
  벽.userData.name = '벽';
  scene.add(벽);
  return 벽;
}
벽만들기(ROOM.width, ROOM.height, [0, ROOM.height / 2, -ROOM.depth / 2], 0);
벽만들기(ROOM.depth, ROOM.height, [-ROOM.width / 2, ROOM.height / 2, 0], Math.PI / 2);
벽만들기(ROOM.width, ROOM.height, [0, ROOM.height / 2, ROOM.depth / 2], 0);
벽만들기(ROOM.depth, ROOM.height, [ROOM.width / 2, ROOM.height / 2, 0], Math.PI / 2);

// --- 격자 도우미 (바닥 눈금. 필요 없으면 이 두 줄을 지우세요) ---
const grid = new THREE.GridHelper(ROOM.width, ROOM.width, 0xaaaaaa, 0xcccccc);
grid.position.y = 0.001;
scene.add(grid);

// --- ① 의 OBJECTS 목록을 읽어서 상자를 하나씩 만듭니다 ---
const objects = {};   // 이름으로 찾아 쓰기 위한 보관함
for (const item of OBJECTS) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(item.size[0], item.size[1], item.size[2]),
    new THREE.MeshStandardMaterial({ color: item.color })
  );
  mesh.position.set(item.pos[0], item.pos[1], item.pos[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData.name = item.name;   // 이름표를 붙여 둡니다
  scene.add(mesh);
  objects[item.name] = mesh;
}

/* ---------------------------------------------------------------------
   ③  문 만들기 — "경첩(hinge)에서 회전"시키는 방법
   ---------------------------------------------------------------------
   상자를 그냥 돌리면 한가운데를 축으로 빙글 돕니다. 실제 문은 경첩이 축이죠.
   그래서 Group(빈 상자)을 경첩 위치에 놓고, 문 판을 그 안에서 폭의 절반만큼
   옆으로 밀어 넣습니다. 그러면 Group을 돌릴 때 경첩을 축으로 돕니다.
   --------------------------------------------------------------------- */
const DOOR = { width: 0.9, height: 2.0, thickness: 0.06 };

const door = new THREE.Group();                     // 경첩 역할
door.position.set(1.55, 0, ROOM.depth / 2 - 0.03);  // 뒷벽에 붙임
door.userData.name = '문';

const doorPanel = new THREE.Mesh(
  new THREE.BoxGeometry(DOOR.width, DOOR.height, DOOR.thickness),
  new THREE.MeshStandardMaterial({ color: 0xa3ceff })
);
doorPanel.position.set(-DOOR.width / 2, DOOR.height / 2, 0);  // 경첩 기준으로 옆·위로 이동
doorPanel.castShadow = true;
doorPanel.userData.name = '문';
door.add(doorPanel);
scene.add(door);

// 문 손잡이 (작은 공)
const handle = new THREE.Mesh(
  new THREE.SphereGeometry(0.045, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.6, roughness: 0.3 })
);
handle.position.set(-DOOR.width + 0.1, DOOR.height / 2, -DOOR.thickness);
door.add(handle);

// 문 열림 각도(도 단위)를 넣으면 문이 그만큼 열립니다. 0 = 닫힘, 90 = 활짝
function setDoorAngle(각도) {
  const 제한 = Math.max(0, Math.min(90, 각도));   // 0~90도 사이로 제한
  door.rotation.y = -THREE.MathUtils.degToRad(제한);
  return 제한;
}
setDoorAngle(0);

// 버튼을 누르면 열림/닫힘 전환
let 열림 = false;
document.getElementById('문버튼').addEventListener('click', () => {
  열림 = !열림;
  setDoorAngle(열림 ? 80 : 0);
});

/* ---------------------------------------------------------------------
   ④  마우스를 올린 물체의 이름 보여주기 (Raycaster)
   --------------------------------------------------------------------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const 이름표 = document.getElementById('물체이름');

renderer.domElement.addEventListener('pointermove', (e) => {
  // 화면 좌표(px)를 -1 ~ 1 범위로 바꿔줍니다 (Three.js 규칙)
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const 맞은것 = raycaster.intersectObjects(scene.children, true);
  const 이름 = 맞은것.length ? (맞은것[0].object.userData.name || '이름 없음') : null;
  이름표.textContent = 이름 ? `👉 ${이름}` : '물체 위에 마우스를 올려보세요';
});

/* ---------------------------------------------------------------------
   ⑤  창 크기가 바뀌면 화면도 맞춰줍니다
   --------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------------------------------------------------------------------
   ⑥  애니메이션 루프 — 1초에 60번쯤 화면을 다시 그립니다
   --------------------------------------------------------------------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ---------------------------------------------------------------------
   ⑦  다른 예제(트윈 예제)에서 이 방을 조종할 수 있도록 창구를 열어둡니다.
       브라우저 콘솔에서 직접 해보세요:
         twin.setDoorAngle(45)
         twin.objects['책상'].position.x = 2
   --------------------------------------------------------------------- */
window.twin = { scene, camera, renderer, objects, door, setDoorAngle };

console.log('[room-template] 준비 완료. 물체:', Object.keys(objects).join(', '));
</script>
</body>
</html>
